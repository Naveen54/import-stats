name: Release

# Builds importstats for Windows (amd64 + arm64) and macOS (a single universal
# amd64+arm64 binary) on every push to main, then publishes the binaries to a
# rolling "latest" GitHub release. Nothing here affects the Go module itself —
# importstats stays a zero-dependency stdlib-only tool; these are just CI
# actions used to build and ship it.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GO_VERSION: "1.23"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  build-windows:
    name: Build (Windows)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/importstats-windows-amd64.exe ./cmd/importstats

      - name: Build windows/arm64
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o dist/importstats-windows-arm64.exe ./cmd/importstats

      - name: Zip artifacts
        run: |
          cd dist
          zip importstats-windows-amd64.zip importstats-windows-amd64.exe
          zip importstats-windows-arm64.zip importstats-windows-arm64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/importstats-windows-amd64.zip
            dist/importstats-windows-arm64.zip
          retention-days: 7

  build-macos:
    name: Build (macOS universal)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build darwin/amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/importstats-darwin-amd64 ./cmd/importstats

      - name: Build darwin/arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o dist/importstats-darwin-arm64 ./cmd/importstats

      - name: Combine into a universal binary
        run: |
          lipo -create -output dist/importstats-darwin-universal \
            dist/importstats-darwin-amd64 dist/importstats-darwin-arm64
          chmod +x dist/importstats-darwin-universal
          lipo -info dist/importstats-darwin-universal

      - name: Archive artifact
        run: |
          cd dist
          tar -czf importstats-darwin-universal.tar.gz importstats-darwin-universal

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/importstats-darwin-universal.tar.gz
          retention-days: 7

  release:
    name: Publish release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: dist

      - name: Record build metadata
        run: |
          {
            echo "Built from ${GITHUB_SHA}"
            echo "Workflow run: ${GITHUB_RUN_ID}"
            date -u +"Built at %Y-%m-%dT%H:%M:%SZ"
          } > dist/BUILD_INFO.txt
          ls -la dist

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automated build from the latest push to `main` (${{ github.sha }}).

            - `importstats-windows-amd64.zip` — Windows, 64-bit Intel/AMD
            - `importstats-windows-arm64.zip` — Windows, ARM64
            - `importstats-darwin-universal.tar.gz` — macOS universal binary (Intel + Apple Silicon)
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/importstats-windows-amd64.zip
            dist/importstats-windows-arm64.zip
            dist/importstats-darwin-universal.tar.gz
            dist/BUILD_INFO.txt
